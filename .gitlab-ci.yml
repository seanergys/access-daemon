stages:
  - build
  - test

variables:
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_SUBMODULE_STRATEGY: "recursive"

default:
  image: debian:bookworm

.build_base:
  stage: build
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
      make
      gcc
      clang
      libc6-dev
      uuid-dev

build:gcc:
  extends: .build_base
  script:
    - make clean
    - make CC=gcc

build:clang:
  extends: .build_base
  script:
    - make CC=clang

build:gcc-extra:
  extends: .build_base
  script:
    - make CC=gcc EXTRA_CFLAGS="-Wextra -Werror -Wno-unused-parameter
      -Wno-sign-compare -Wno-missing-field-initializers -Wno-enum-conversion"

.test_base:
  stage: test

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
      make
      gcc
      libc6-dev
      uuid-dev
      valgrind

test:valgrind:
  extends: .test_base

  variables:
    EXEC_PREFIX: >-
      valgrind
      --tool=memcheck
      --leak-check=full
      --show-leak-kinds=all
      --track-origins=yes
      --error-exitcode=99

  script:
    - make CC=gcc
    - LD_PRELOAD="$CI_PROJECT_DIR/src/plugins/preloads/libsim-msr.so:$CI_PROJECT_DIR/src/plugins/preloads/libsim-nvml.so"
      timeout 30s ./run-test.sh < ./run-test-commands.txt

test:sanitizers:
  extends: .test_base

  variables:
    EXTRA_CFLAGS: >-
      -O1
      -fsanitize=address,undefined
      -fno-omit-frame-pointer
      -fno-sanitize-recover=all

    EXTRA_LDFLAGS: >-
      -fsanitize=address,undefined

    ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
    UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"

  script:
    - make CC=gcc EXTRA_CFLAGS="$EXTRA_CFLAGS" EXTRA_LDFLAGS="$EXTRA_LDFLAGS"
    - LD_PRELOAD="$(gcc -print-file-name=libasan.so):$CI_PROJECT_DIR/src/plugins/preloads/libsim-msr.so:$CI_PROJECT_DIR/src/plugins/preloads/libsim-nvml.so"
      timeout 30s ./run-test.sh < ./run-test-commands.txt
