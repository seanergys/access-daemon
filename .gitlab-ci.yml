image: debian:bookworm-slim

variables:
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_SUBMODULE_STRATEGY:    recursive

build_and_check_install:
  stage: build
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential
  script:
    # Command-line assignments override the local paths in the root Makefile.
    - make SEANERBUS_PREFIX= clean
    - make SEANERBUS_PREFIX=
    - make SEANERBUS_PREFIX= PREFIX="$CI_PROJECT_DIR/installed" install
    - |
      set -eu
      for installed_file in \
          sbin/accessd \
          etc/run.sh \
          include/metrics_types.h \
          include/access_easybus.h \
          lib/libcommon.so \
          lib/plugins/keyboard.so \
          lib/plugins/metrics_accumulator.so \
          lib/plugins/metrics_caller.so \
          lib/plugins/request_handler.so \
          lib/plugins/request_handler_text.so \
          lib/plugins/topology_ext.so \
          lib/plugins/metrics/met.cpu_freq.msr.so \
          lib/plugins/metrics/met.cpu_pow.msr.so \
          lib/plugins/actuators/act.cpu_freq.hsmp.so \
          lib/plugins/actuators/act.cpu_freq.driver_pstate.so \
          lib/plugins/actuators/act.cpu_freq.driver_acpi.so \
          lib/plugins/actuators/act.cpu_freq.driver_governor.so \
          lib/plugins/actuators/act.cpu_pow.msr.so \
          lib/plugins/actuators/act.cpu_pow.hsmp.so
      do
          if [ ! -s "$CI_PROJECT_DIR/installed/$installed_file" ]; then
              echo "Missing or empty installed file: $installed_file" >&2
              exit 1
          fi
      done
      test -x "$CI_PROJECT_DIR/installed/sbin/accessd"
      test ! -e "$CI_PROJECT_DIR/installed/lib/libaccess_easybus.so"
      test ! -e "$CI_PROJECT_DIR/installed/lib/plugins/seanerbus.so"
